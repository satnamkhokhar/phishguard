
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed in the browser tab -->
    <title>Login | PhishGuard</title>

    <!-- Reuse the main PhishGuard stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Shared PhishGuard header and navigation -->
    <header>
        <h1>PhishGuard</h1>

        <nav>
            <a href="/login.html">Login</a>
            <a href="/register.html">Register</a>

            <!-- Dark/light theme toggle -->
            <button id="theme-toggle">Light Mode</button>
        </nav>
    </header>

    <!-- Main login content -->
    <main>
        <section class="auth-container">

            <h2>Log In</h2>
            <p>Welcome back to PhishGuard.</p>

            <!-- Send login credentials to the Node.js backend -->
            <form action="/login" method="POST">

                <!-- Username input -->
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <!-- Password input -->
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <!-- Submit the login form -->
                <button type="submit">Log In</button>
            </form>

            <!-- Link for users without an account -->
            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </section>
    </main>

    <!-- Shared website footer -->
    <footer>
        <p>&copy; 2026 PhishGuard</p>
    </footer>

    <!-- Reuse the existing dark/light theme functionality -->
    <script src="js/theme.js"></script>

</body>
</html>
