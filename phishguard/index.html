<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed in the browser tab -->
    <title>PhishGuard</title>

    <!-- Links the external stylesheet to this page -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Page header containing the site name and navigation -->
    <header>
        <h1>PhishGuard</h1>

        <!-- Navigation links -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>

            <!-- Dark/light theme toggle -->
            <button id="theme-toggle">Light Mode</button>

            <!-- Logout button -->
            <form action="/logout" method="POST" class="logout-form">
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </nav>
    </header>

    <!-- Main content of the home page -->
    <main>

        <!-- Introduction to PhishGuard -->
        <h2>Welcome to PhishGuard</h2>

        <p>
            PhishGuard is a web application designed to help users better understand
            and identify suspicious website links.
        </p>

        <p>
            Visit the About page to learn more about the project.
        </p>

    </main>

    <!-- JavaScript used to control the website theme -->
    <script src="js/theme.js"></script>

</body>

</html>
